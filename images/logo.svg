<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="walletGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Wallet Icon -->
  <g transform="translate(10, 10)">
    <!-- Wallet body -->
    <rect x="0" y="8" width="32" height="24" rx="4" ry="4" fill="url(#walletGradient)" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Wallet flap -->
    <path d="M 4 8 L 28 8 Q 32 8 32 12 L 32 16 Q 32 20 28 20 L 4 20 Q 0 20 0 16 L 0 12 Q 0 8 4 8 Z" fill="url(#walletGradient)" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Card slot -->
    <rect x="6" y="14" width="20" height="2" rx="1" ry="1" fill="#ffffff" opacity="0.3"/>
    
    <!-- Money bills -->
    <rect x="4" y="4" width="16" height="8" rx="1" ry="1" fill="#22c55e" opacity="0.8" stroke="#16a34a" stroke-width="0.5"/>
    <rect x="6" y="2" width="16" height="8" rx="1" ry="1" fill="#22c55e" opacity="0.9" stroke="#16a34a" stroke-width="0.5"/>
    <rect x="8" y="0" width="16" height="8" rx="1" ry="1" fill="#22c55e" stroke="#16a34a" stroke-width="0.5"/>
    
    <!-- Dollar signs on bills -->
    <text x="16" y="5" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#16a34a" text-anchor="middle">$</text>
    <text x="18" y="7" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="#16a34a" text-anchor="middle">$</text>
  </g>
  
  <!-- CashTrack Text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c5aa0">Cash</text>
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff6b35">Track</text>
  
  <!-- Tagline -->
  <text x="55" y="52" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Control de Gastos</text>
</svg>